config-version = "2.7"

# Velocity internal Minecraft TCP listener
bind = "127.0.0.1:25565"

motd = "&bEaglercraft Gateway"
show-max-players = 60
online-mode = false
prevent-client-proxy-connections = false

# Connects to Shockbyte as a standard client (no changes needed on Shockbyte)
player-info-forwarding-mode = "none"
forwarding-secret-file = "forwarding.secret"

[servers]
shockbyte = "157.85.94.60:20929"
try = [
    "shockbyte"
]

[forced-hosts]

[advanced]
compression-threshold = 256
compression-level = -1
login-ratelimit = 0
connection-timeout = 15000
read-timeout = 30000
haproxy-protocol = false
tcp-fast-open = false
bungee-plugin-channel-enabled = true
show-ping-requests = false
failover-on-disconnect = true
announce-proxy-commands = true
